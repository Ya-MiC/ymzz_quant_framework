[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymzz-quant-lab"
version = "0.1.0"
description = "晏銘湛箴多市場量化研究框架"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Yamic" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.6",
  "aiogram>=3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ymzz-web = "ymzz.api:main"
ymzz-examples = "ymzz.examples:main"
ymzz-cli = "ymzz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
